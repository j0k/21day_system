<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"
     width="512" height="512" role="img" aria-label="21day_system">
  <title>21day_system</title>
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="78%">
      <stop offset="0%" stop-color="#16333c"/>
      <stop offset="55%" stop-color="#0d1a24"/>
      <stop offset="100%" stop-color="#080d12"/>
    </radialGradient>
    <linearGradient id="num" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cfe6ee"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- подложка -->
  <rect x="0" y="0" width="512" height="512" rx="112" ry="112"
        fill="url(#bg)"/>
  <rect x="10" y="10" width="492" height="492" rx="103" ry="103"
        fill="none" stroke="#1d3440" stroke-width="2"/>

  <!-- радарные окружности -->
  <g fill="none" stroke="#1f4a55" stroke-width="2">
    <circle cx="256" cy="256" r="118" opacity="0.55"/>
    <circle cx="256" cy="256" r="166" opacity="0.35"/>
  </g>

  <!-- луч радара -->
  <line x1="256" y1="256" x2="256.0"
        y2="51.0" stroke="#2f6d7a" stroke-width="2"
        opacity="0.5"/>

  <!-- 21 деление: три недели -->
  <g>
    <g stroke="#3fae6a" stroke-width="13" stroke-linecap="round" opacity="1"><line x1="256.0" y1="84.0" x2="256.0" y2="51.0"/></g>
    <g stroke="#3fae6a" stroke-width="13" stroke-linecap="round" opacity="1"><line x1="306.7" y1="91.6" x2="316.4" y2="60.1"/></g>
    <g stroke="#3fae6a" stroke-width="13" stroke-linecap="round" opacity="1"><line x1="352.9" y1="113.9" x2="371.5" y2="86.6"/></g>
    <g stroke="#3fae6a" stroke-width="13" stroke-linecap="round" opacity="1"><line x1="390.5" y1="148.8" x2="416.3" y2="128.2"/></g>
    <g stroke="#3fae6a" stroke-width="13" stroke-linecap="round" opacity="1"><line x1="416.1" y1="193.2" x2="446.8" y2="181.1"/></g>
    <g stroke="#3fae6a" stroke-width="13" stroke-linecap="round" opacity="1"><line x1="427.5" y1="243.1" x2="460.4" y2="240.7"/></g>
    <g stroke="#3fae6a" stroke-width="13" stroke-linecap="round" opacity="1"><line x1="423.7" y1="294.3" x2="455.9" y2="301.6"/></g>
    <g stroke="#4f8fe0" stroke-width="13" stroke-linecap="round" opacity="1"><line x1="405.0" y1="342.0" x2="433.5" y2="358.5"/></g>
    <g stroke="#4f8fe0" stroke-width="13" stroke-linecap="round" opacity="1"><line x1="373.0" y1="382.1" x2="395.4" y2="406.3"/></g>
    <g stroke="#4f8fe0" stroke-width="13" stroke-linecap="round" opacity="1"><line x1="330.6" y1="411.0" x2="344.9" y2="440.7"/></g>
    <g stroke="#4f8fe0" stroke-width="13" stroke-linecap="round" opacity="1"><line x1="281.6" y1="426.1" x2="286.6" y2="458.7"/></g>
    <g stroke="#4f8fe0" stroke-width="13" stroke-linecap="round" opacity="1"><line x1="230.4" y1="426.1" x2="225.4" y2="458.7"/></g>
    <g stroke="#4f8fe0" stroke-width="13" stroke-linecap="round" opacity="1"><line x1="181.4" y1="411.0" x2="167.1" y2="440.7"/></g>
    <g stroke="#4f8fe0" stroke-width="13" stroke-linecap="round" opacity="1"><line x1="139.0" y1="382.1" x2="116.6" y2="406.3"/></g>
    <g stroke="#f08a3c" stroke-width="13" stroke-linecap="round" opacity="1"><line x1="107.0" y1="342.0" x2="78.5" y2="358.5"/></g>
    <g stroke="#26323f" stroke-width="13" stroke-linecap="round" opacity="0.9"><line x1="88.3" y1="294.3" x2="56.1" y2="301.6"/></g>
    <g stroke="#26323f" stroke-width="13" stroke-linecap="round" opacity="0.9"><line x1="84.5" y1="243.1" x2="51.6" y2="240.7"/></g>
    <g stroke="#26323f" stroke-width="13" stroke-linecap="round" opacity="0.9"><line x1="95.9" y1="193.2" x2="65.2" y2="181.1"/></g>
    <g stroke="#26323f" stroke-width="13" stroke-linecap="round" opacity="0.9"><line x1="121.5" y1="148.8" x2="95.7" y2="128.2"/></g>
    <g stroke="#26323f" stroke-width="13" stroke-linecap="round" opacity="0.9"><line x1="159.1" y1="113.9" x2="140.5" y2="86.6"/></g>
    <g stroke="#26323f" stroke-width="13" stroke-linecap="round" opacity="0.9"><line x1="205.3" y1="91.6" x2="195.6" y2="60.1"/></g>
  </g>

  <!-- маркер текущего дня -->
  <circle cx="72.2" cy="297.9" r="9" fill="#ffd479"
          filter="url(#glow)"/>

  <!-- число -->
  <text x="256" y="260" text-anchor="middle"
        dominant-baseline="central"
        font-family="Bahnschrift, 'Segoe UI', Arial, Helvetica, sans-serif"
        font-size="168" font-weight="700" letter-spacing="-6"
        fill="url(#num)">21</text>

  <!-- подпись -->
  <text x="256" y="364" text-anchor="middle"
        font-family="Bahnschrift, 'Segoe UI', Arial, Helvetica, sans-serif"
        font-size="30" font-weight="600" letter-spacing="7"
        fill="#5f8794">DAYS</text>
</svg>
